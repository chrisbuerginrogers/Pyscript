<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/eclipse.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/shell/shell.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/yaml/yaml.min.js"></script>
    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }
        .container-fluid {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        .header {
            padding: 15px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .tree-panel {
            flex: 0 0 35%;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            padding: 15px;
        }
        .file-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }
        .file-content {
            flex: 1;
            overflow-y: auto;
            background-color: #f5f5f5;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .file-content pre {
            margin: 0;
            padding: 15px;
            height: 100%;
            overflow: auto;
            background-color: #f5f5f5;
        }
        .file-content code {
            white-space: pre;
        }
        .file-content textarea {
            width: 100%;
            height: 100%;
            padding: 15px;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background-color: #ffffff;
            color: #333;
            resize: none;
        }
        .file-content textarea:focus {
            outline: none;
        }
        .button-group {
            margin-bottom: 10px;
        }
        .button-group button {
            margin-right: 10px;
        }
        .CodeMirror {
            height: 100% !important;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .dotfile-toggle {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #dee2e6;
            font-size: 12px;
        }
        .tabs-container {
            display: flex;
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            overflow-x: auto;
            padding: 0;
            margin: 0;
        }
        .tab {
            display: inline-flex;
            align-items: center;
            padding: 10px 15px;
            background-color: #e9ecef;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        .tab:hover {
            background-color: #dee2e6;
        }
        .tab.active {
            background-color: #ffffff;
            border-bottom-color: #0d6efd;
        }
        .tab-close {
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
            padding: 0 5px;
        }
        .tab-close:hover {
            color: #dc3545;
        }
        .tree-item {
            cursor: pointer;
            user-select: none;
            padding: 5px;
            border-radius: 3px;
            margin: 2px 0;
        }
        .tree-item:hover {
            background-color: #e9ecef;
        }
        .tree-item.selected {
            background-color: #0d6efd;
            color: white;
        }
        .file-info {
            color: #6c757d;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .toggle-btn {
            cursor: pointer;
            display: inline-block;
            width: 20px;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="header">
            <button id="openFolderBtn" class="btn btn-primary">Open Folder</button>
            <button id="newFileBtn" class="btn btn-success ms-2" style="display:none;">➕ New File</button>
            <span id="folderName" class="ms-3" style="font-weight: bold;"></span>
        </div>
        <div class="content">
            <div class="tree-panel">
                <div id="treeContainer"></div>
                <div class="dotfile-toggle">
                    <input type="checkbox" id="showDotfiles" style="display:none;">
                    <label for="showDotfiles" style="margin: 0; cursor: pointer; display:none;" id="dotfileLabel">
                        Show dotfiles
                    </label>
                </div>
            </div>
            <div class="file-panel">
                <div id="tabsContainer" class="tabs-container"></div>
                <div id="fileInfo" class="file-info">Select a file to view contents</div>
                <div class="button-group">
                    <button id="editBtn" class="btn btn-sm btn-warning" style="display:none;">✏️ Edit</button>
                    <button id="saveBtn" class="btn btn-sm btn-success" style="display:none;">💾 Save</button>
                    <button id="cancelBtn" class="btn btn-sm btn-secondary" style="display:none;">✕ Cancel</button>
                </div>
                <div id="fileContent" class="file-content"></div>
            </div>
        </div>
    </div>

    <script>
        let rootHandle = null;
        const expandedFolders = new Set();
        let currentFileHandle = null;
        let currentFilePath = null;
        let isEditing = false;
        let showDotfiles = false;
        let codeMirrorEditor = null;
        
        // Tab management
        const openFiles = new Map(); // filePath -> {handle, content, isEditing}
        let activeTab = null;

        document.getElementById('openFolderBtn').addEventListener('click', async () => {
            try {
                rootHandle = await window.showDirectoryPicker();
                document.getElementById('folderName').innerHTML = `📁 ${rootHandle.name}`;
                document.getElementById('newFileBtn').style.display = 'inline-block';
                document.getElementById('showDotfiles').style.display = 'inline-block';
                document.getElementById('dotfileLabel').style.display = 'inline-block';
                expandedFolders.clear();
                await renderTree();
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('fileInfo').innerHTML = `Error`;
                document.getElementById('editBtn').style.display = 'none';
                document.getElementById('saveBtn').style.display = 'none';
                document.getElementById('cancelBtn').style.display = 'none';
                document.getElementById('fileContent').innerHTML = `<pre style="padding: 15px;">Error: ${err.message}</pre>`;
            }
        });

        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';
            
            for (const filePath of openFiles.keys()) {
                const tabName = filePath.split('/').pop();
                const tab = document.createElement('button');
                tab.className = 'tab' + (activeTab === filePath ? ' active' : '');
                tab.innerHTML = `<span>${tabName}</span><span class="tab-close">✕</span>`;
                
                tab.addEventListener('click', (e) => {
                    if (e.target.closest('.tab-close')) {
                        closeTab(filePath);
                    } else {
                        switchTab(filePath);
                    }
                });
                
                tabsContainer.appendChild(tab);
            }
        }

        function switchTab(filePath) {
            activeTab = filePath;
            const fileData = openFiles.get(filePath);
            currentFileHandle = fileData.handle;
            currentFilePath = filePath;
            isEditing = fileData.isEditing;
            
            renderTabs();
            
            if (isEditing) {
                renderEditMode(filePath);
            } else {
                renderViewMode(filePath);
            }
        }

        function closeTab(filePath) {
            openFiles.delete(filePath);
            
            if (activeTab === filePath) {
                activeTab = openFiles.keys().next().value || null;
                if (activeTab) {
                    switchTab(activeTab);
                } else {
                    document.getElementById('fileInfo').innerHTML = 'Select a file to view contents';
                    document.getElementById('fileContent').innerHTML = '';
                    document.getElementById('editBtn').style.display = 'none';
                    document.getElementById('saveBtn').style.display = 'none';
                    document.getElementById('cancelBtn').style.display = 'none';
                }
            }
            
            renderTabs();
        }

        function addTab(filePath, handle, content) {
            openFiles.set(filePath, {
                handle: handle,
                content: content,
                isEditing: false
            });
            
            activeTab = filePath;
            currentFileHandle = handle;
            currentFilePath = filePath;
            isEditing = false;
            
            renderTabs();
            renderViewMode(filePath);
        }

        function renderViewMode(filePath) {
            const fileData = openFiles.get(filePath);
            const content = fileData.content;
            
            document.getElementById('fileInfo').innerHTML = `📄 ${filePath}`;
            document.getElementById('editBtn').style.display = 'inline-block';
            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'none';
            
            const extension = filePath.split('.').pop().toLowerCase();
            let language = 'plaintext';
            
            const languageMap = {
                'js': 'javascript',
                'py': 'python',
                'css': 'css',
                'html': 'html',
                'json': 'json',
                'xml': 'xml',
                'java': 'java',
                'cpp': 'cpp',
                'c': 'c',
                'ts': 'typescript',
                'tsx': 'typescript',
                'jsx': 'javascript',
                'rb': 'ruby',
                'php': 'php',
                'sql': 'sql',
                'sh': 'bash',
                'md': 'markdown',
                'yaml': 'yaml',
                'yml': 'yaml'
            };
            
            if (languageMap[extension]) {
                language = languageMap[extension];
            }
            
            const escaped = content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            
            const highlighted = hljs.highlight(escaped, { language, ignoreIllegals: true }).value;
            document.getElementById('fileContent').innerHTML = `<pre><code class="language-${language}">${highlighted}</code></pre>`;
        }

        function renderEditMode(filePath) {
            const fileData = openFiles.get(filePath);
            const content = fileData.content;
            const extension = filePath.split('.').pop().toLowerCase();
            
            const languageMap = {
                'js': 'javascript',
                'py': 'python',
                'css': 'css',
                'html': 'htmlmixed',
                'json': 'javascript',
                'xml': 'xml',
                'java': 'text/x-java',
                'cpp': 'text/x-c++src',
                'c': 'text/x-csrc',
                'ts': 'javascript',
                'tsx': 'javascript',
                'jsx': 'javascript',
                'rb': 'text/x-ruby',
                'php': 'application/x-httpd-php',
                'sql': 'text/x-sql',
                'sh': 'application/x-sh',
                'md': 'text/x-markdown',
                'yaml': 'text/x-yaml',
                'yml': 'text/x-yaml'
            };
            
            const language = languageMap[extension] || 'null';
            
            const fileContent = document.getElementById('fileContent');
            fileContent.innerHTML = '';
            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'inline-block';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            
            codeMirrorEditor = CodeMirror(fileContent, {
                value: content,
                mode: language,
                theme: 'eclipse',
                lineNumbers: true,
                indentUnit: 4,
                indentWithTabs: false
            });
        }

        async function renderTree() {
            if (!rootHandle) return;
            
            const html = await renderFolder(rootHandle, 0, '');
            document.getElementById('treeContainer').innerHTML = html;
            attachEvents();
        }

        async function renderFolder(folderHandle, depth, path) {
            let html = '';
            const items = [];

            try {
                for await (const entry of folderHandle.entries()) {
                    items.push(entry);
                }
            } catch (err) {
                return html;
            }

            items.sort((a, b) => {
                const aIsDir = a[1].kind === 'directory';
                const bIsDir = b[1].kind === 'directory';
                if (aIsDir !== bIsDir) return bIsDir - aIsDir;
                return a[0].localeCompare(b[0]);
            });

            for (const [name, handle] of items) {
                // Skip dotfiles if not showing them
                if (!showDotfiles && name.startsWith('.')) {
                    continue;
                }

                const currentPath = path ? `${path}/${name}` : name;
                const indent = depth * 20;

                if (handle.kind === 'directory') {
                    const isExpanded = expandedFolders.has(currentPath);
                    const symbol = isExpanded ? '▼' : '▶';
                    html += `<div class="tree-item" style="margin-left: ${indent}px;" data-path="${currentPath}" data-type="folder">`;
                    html += `<span class="toggle-btn">${symbol}</span> 📁 ${name}</div>`;

                    if (isExpanded) {
                        const subHtml = await renderFolder(handle, depth + 1, currentPath);
                        html += subHtml;
                    }
                } else {
                    html += `<div class="tree-item" style="margin-left: ${indent}px;" data-path="${currentPath}" data-type="file">📄 ${name}</div>`;
                }
            }

            return html;
        }

        function attachEvents() {
            document.querySelectorAll('.tree-item').forEach(item => {
                item.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const itemType = item.getAttribute('data-type');
                    const path = item.getAttribute('data-path');

                    if (itemType === 'folder') {
                        if (expandedFolders.has(path)) {
                            expandedFolders.delete(path);
                        } else {
                            expandedFolders.add(path);
                        }
                        await renderTree();
                    } else if (itemType === 'file') {
                        document.querySelectorAll('[data-type="file"]').forEach(el => {
                            el.classList.remove('selected');
                        });
                        item.classList.add('selected');
                        await loadFile(path);
                    }
                });
            });
        }

        async function loadFile(filePath) {
            try {
                // Check if file is already open
                if (openFiles.has(filePath)) {
                    switchTab(filePath);
                    return;
                }

                const parts = filePath.split('/');
                let handle = rootHandle;

                for (let i = 0; i < parts.length - 1; i++) {
                    handle = await handle.getDirectoryHandle(parts[i]);
                }

                const fileHandle = await handle.getFileHandle(parts[parts.length - 1]);
                const file = await fileHandle.getFile();

                try {
                    const content = await file.text();
                    addTab(filePath, fileHandle, content);
                } catch (err) {
                    // For binary files, show error in a simple way
                    openFiles.set(filePath, {
                        handle: fileHandle,
                        content: '[Binary file - cannot display]',
                        isEditing: false
                    });
                    activeTab = filePath;
                    currentFileHandle = fileHandle;
                    currentFilePath = filePath;
                    renderTabs();
                    document.getElementById('fileInfo').innerHTML = `📄 ${filePath}`;
                    document.getElementById('editBtn').style.display = 'none';
                    document.getElementById('saveBtn').style.display = 'none';
                    document.getElementById('cancelBtn').style.display = 'none';
                    document.getElementById('fileContent').innerHTML = '<pre style="padding: 15px;">[Binary file - cannot display]</pre>';
                }
            } catch (err) {
                document.getElementById('fileInfo').innerHTML = `Error`;
                document.getElementById('fileContent').innerHTML = `<pre style="padding: 15px;">Error: ${err.message}</pre>`;
            }
        }


        function enterEditMode() {
            if (!activeTab) return;
            
            const fileData = openFiles.get(activeTab);
            fileData.isEditing = true;
            isEditing = true;
            
            renderEditMode(activeTab);
        }

        function cancelEdit() {
            if (!activeTab) return;
            
            const fileData = openFiles.get(activeTab);
            fileData.isEditing = false;
            isEditing = false;
            
            renderViewMode(activeTab);
        }

        async function saveFile() {
            if (!currentFileHandle || !activeTab) return;
            
            const content = codeMirrorEditor.getValue();
            const fileData = openFiles.get(activeTab);
            
            try {
                const writable = await currentFileHandle.createWritable();
                await writable.write(content);
                await writable.close();
                
                // Update content in the tab and exit edit mode
                fileData.content = content;
                fileData.isEditing = false;
                isEditing = false;
                
                renderViewMode(activeTab);
                alert('File saved successfully!');
            } catch (err) {
                alert(`Error saving file: ${err.message}`);
            }
        }

        // Button event listeners
        document.getElementById('editBtn').addEventListener('click', enterEditMode);
        document.getElementById('saveBtn').addEventListener('click', saveFile);
        document.getElementById('cancelBtn').addEventListener('click', cancelEdit);

        // New file button
        document.getElementById('newFileBtn').addEventListener('click', async () => {
            const fileName = prompt('Enter file name:');
            if (!fileName) return;
            
            try {
                const fileHandle = await rootHandle.getFileHandle(fileName, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write('');
                await writable.close();
                
                expandedFolders.clear();
                await renderTree();
                alert(`File "${fileName}" created successfully!`);
            } catch (err) {
                alert(`Error creating file: ${err.message}`);
            }
        });

        // Dotfile toggle
        document.getElementById('showDotfiles').addEventListener('change', async (e) => {
            showDotfiles = e.target.checked;
            await renderTree();
        });
    </script>
</body>
</html>
