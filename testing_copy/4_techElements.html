<!DOCTYPE html>
<html lang="en">
<head>
    <title>REPL</title>

    <!-- Recommended meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!-- Safari SharedArrayBuffer -->
    <!-- <script src="./safari-sab.js"></script> -->

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.10.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.10.3/core.js"></script>
    
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="codemirror.min.css">

    <script>
        globalThis.init = Promise.withResolvers();
        globalThis.init.promise.then(utils => {
            const { xworker } = document.querySelector('[worker]');
            Object.assign(xworker.sync, utils);
        });
    </script>

</head>
<body>
    <h1 style="text-align: center;">Rogers Python Intro</h1>
    <div id="breadcrumb-container"></div>

    <div id="headertext" style="display: flex;  margin: 20px;">
The goal of this page is to learn how to talk to the Tech Elements.
    </div>

    <div id="container" style="display: flex; height: 100vh; gap: 0;">
        <div id="left" style="flex: 1; overflow: auto;">
            <div id="code" class="editor-container" >
                <h2>Writing your own code</h2>
                <textarea id="code-editor" >
wait.channel('1')
motor.run_to(40)
wait.time(2)
motor.run_to(0)
wait.time(2)
channel.send('2')
</textarea>
                <button id="REPLRun">Run in REPL</button>
                <script type="mpy-editor" env = 'image'>
import asyncio
import time
                    
async def test():
    motor.run_left(20)
	await asyncio.sleep(2)
    motor.stop()
    
    
    
    

    
loop = asyncio.get_event_loop()
task = asyncio.wait_for(test(), timeout=6)
loop.create_task(task)
                </script>
            </div>
        </div>
        <div id="divider" style="width: 5px; background-color: #ccc; cursor: col-resize;"></div>
        <div id="right" style="flex: 1; overflow: auto; padding: 20px;">
            <div id='all_things_channels'></div>
            <script type="mpy" src="./main.py" config="./pyscript.json" env = 'image'></script>

            <script id="python-terminal" type="mpy" src="./4_techElements.py" config="./pyscript.json" style="width: 50px" env = 'george' terminal worker></script>
            <div id='hub1'></div>
            <div id='hub2'></div>
        </div>
    </div>
<!-- CodeMirror JS -->
    <script src="codemirror.min.js"></script>
    <script src="python.min.js"></script>
    
    <script src="scripts.js"></script>    
    <!-- <script type="module" src="./call.js" </script> -->
     
</body>
</html>
